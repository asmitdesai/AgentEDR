[project]
name = "agentedr"
version = "0.1.0"
description = "Kernel-level detection for hijacked AI coding agents (eBPF sensor + Python engine)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Asmit Desai" }]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.scripts]
agentedr = "agentedr.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentedr"]
# _bin/ holds the sensor binaries; gitignored, but must ship in the wheel.
artifacts = ["src/agentedr/_bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs root, a built sensor and a BPF-capable kernel"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["sensor/libbpf", "sensor/bpftool"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
